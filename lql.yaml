name: lql
kind: package
language: rust
version: 0.5.1
description: LOZA Query Language compiler and tooling
license: MIT
repository: https://github.com/Astraive/lql
module: github.com/Astraive/lql

paths:
  root: .
  dockerfile: Dockerfile

publish:
  github_release:
    owner: astraive
    artifact: lql
    binaries: true
    signed: true
  crates:
    owner: astraive
    packages:
      - lql
      - lql-client
  docker:
    owner: astraive
    images:
      - ghcr.io/astraive/lql
