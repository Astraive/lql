name: LQL Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages after dry-run validation
        required: true
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from Cargo.toml
        id: read
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^version =/{print $2; exit}' Cargo.toml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved LQL version: ${version}"

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: lql-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: lql-linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: lql-macos-x64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: lql-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lql-windows-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} --bin lql
      - name: Stage binary and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          mkdir -p dist
          suffix=""
          if [[ "$TARGET" == *windows* ]]; then suffix=".exe"; fi
          cp "target/$TARGET/release/lql${suffix}" "dist/${ARTIFACT}${suffix}"
          python - "$ARTIFACT" "$suffix" <<'PY'
          import hashlib
          import pathlib
          import sys
          artifact = pathlib.Path("dist") / f"{sys.argv[1]}{sys.argv[2]}"
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          (artifact.with_suffix(artifact.suffix + ".sha256")).write_text(f"{digest}  {artifact.name}\n", encoding="utf-8")
          PY
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  validate:
    needs: [binaries, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LQL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate versions and source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(awk -F '\"' '/^version =/{print $2; exit}' Cargo.toml)" = "$LQL_VERSION"
          test "$(awk -F '\"' '/^version =/{print $2; exit}' clients/rust/Cargo.toml)" = "$LQL_VERSION"
          cargo fmt --all -- --check
          cargo test --workspace
          cargo build --locked --release --target wasm32-unknown-unknown --lib
      - name: Dry-run crate publications
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path clients/rust/Cargo.toml
          cargo publish --dry-run --allow-dirty --manifest-path clients/rust/Cargo.toml
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Build container and smoke-test compiler handshake
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo build --locked --release --bin lql
          cp target/release/lql dist/lql
          docker build -t ghcr.io/astraive/lql:${LQL_VERSION} .
          response="$(printf '%s\n' '{"id":1,"method":"handshake","protocol_version":1,"language_version":"0.1","params":{}}' | docker run --rm -i --entrypoint /usr/local/bin/lql ghcr.io/astraive/lql:${LQL_VERSION} serve --stdio)"
          LQL_HANDSHAKE="$response" python -c 'import json, os; assert json.loads(os.environ["LQL_HANDSHAKE"])["result"]["compiler_version"] == os.environ["LQL_VERSION"]'

  publish-cargo:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish == true }}
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cargo-publish.yml
    secrets:
      CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}

  publish-image:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish == true }}
    needs: [validate, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      LQL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish LQL runtime image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "artifacts/lql-linux-x64/lql-linux-x64" dist/lql
          docker build -t "ghcr.io/astraive/lql:${LQL_VERSION}" .
          docker push "ghcr.io/astraive/lql:${LQL_VERSION}"

  publish-release:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish == true }}
    needs: [validate, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LQL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Publish GitHub release artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.LQL_VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/**/*.sha256
            artifacts/**/*-x64
            artifacts/**/*-arm64
            artifacts/**/*.exe
          generate_release_notes: true
