name: LQL CI

on:
  push:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "lql.yaml"
      - ".gitignore"
      - "scripts/check-no-target-artifacts.sh"
      - ".github/workflows/ci.yml"
      - "src/**"
      - "clients/**"
      - "schemas/**"
      - "scripts/**"
      - "benches/**"
      - "tests/**"
      - "Dockerfile"
      - ".github/**"
      - "**/*.md"
      - ".gitignore"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "lql.yaml"
      - ".gitignore"
      - "scripts/check-no-target-artifacts.sh"
      - ".github/workflows/ci.yml"
      - "src/**"
      - "clients/**"
      - "schemas/**"
      - "scripts/**"
      - "benches/**"
      - "tests/**"
      - "Dockerfile"
      - ".github/**"
      - "**/*.md"
      - ".gitignore"

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  no-tracked-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against tracked build artifacts
        run: bash scripts/check-no-target-artifacts.sh
      - name: Guard self-test
        run: bash scripts/check-no-target-artifacts.sh --self-test

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .
      - name: Build
        run: cargo build --lib --bins --tests
      - name: Test
        run: cargo test --all-features
      - name: Test client crate
        run: cargo test --manifest-path clients/rust/Cargo.toml
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check

  wasm:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Build WASM
        run: wasm-pack build . --target web --release
        env:
          WASM_PACK_PROFILE: release
