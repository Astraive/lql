name: Cargo Publish

on:
  workflow_call:
    secrets:
      CRATES_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write
jobs:
  publish-client:
    runs-on: ubuntu-latest
    env:
      CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io via Trusted Publishing
        id: crates-auth
        if: ${{ env.CRATES_TOKEN == '' }}
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish lql-client crate
        shell: bash
        run: |
          set -euo pipefail
          if cargo publish --manifest-path clients/rust/Cargo.toml; then
            exit 0
          fi
          cargo info --registry crates-io lql-client@0.5.0 >/dev/null
          echo "lql-client 0.5.0 is already published; continuing"
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CRATES_TOKEN || steps.crates-auth.outputs.token }}

  publish-root:
    needs: publish-client
    runs-on: ubuntu-latest
    env:
      CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io via Trusted Publishing
        id: crates-auth
        if: ${{ env.CRATES_TOKEN == '' }}
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish lql crate after registry propagation
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CRATES_TOKEN || steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^version =/{print $2; exit}' Cargo.toml)"
          for attempt in {1..3}; do
            if cargo publish; then
              exit 0
            fi
            if cargo info --registry crates-io "lql@${version}" >/dev/null 2>&1; then
              echo "lql ${version} is already published; continuing"
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            sleep 360
          done
