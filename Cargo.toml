[package]
name = "lql"
version = "0.4.3"
edition = "2021"
description = "LOZA Query Language compiler for DuckDB and ClickHouse"
exclude = ["target/**", "clients/rust/target/**", "dist/**"]
repository = "https://github.com/Astraive/lql"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lql-client = { version = "0.4.3", path = "clients/rust" }

[dev-dependencies]
insta = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "lql_bench"
harness = false
