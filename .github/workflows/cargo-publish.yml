name: Cargo Publish

on:
  workflow_call:
    secrets:
      CRATES_TOKEN:
        required: false

permissions: {}
jobs:
  publish-client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Authenticate with crates.io via Trusted Publishing
        id: crates-auth
        if: ${{ env.CRATES_TOKEN == '' }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - name: Publish lql-client crate
        shell: bash
        run: bash scripts/publish_crate.sh clients/rust/Cargo.toml lql-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CRATES_TOKEN || steps.crates-auth.outputs.token }}

  publish-root:
    needs: publish-client
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Authenticate with crates.io via Trusted Publishing
        id: crates-auth
        if: ${{ env.CRATES_TOKEN == '' }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - name: Publish lql crate after registry propagation
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CRATES_TOKEN || steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail
          version="$(awk -F '"' '/^version =/{print $2; exit}' Cargo.toml)"
          for attempt in {1..3}; do
            if cargo publish; then
              exit 0
            fi
            if cargo info --registry crates-io "lql@${version}" >/dev/null 2>&1; then
              echo "lql ${version} is already published; continuing"
              exit 0
            fi
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            sleep 360
          done
