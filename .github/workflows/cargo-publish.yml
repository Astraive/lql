name: Cargo Publish

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  publish-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish lql-client crate
        run: cargo publish --manifest-path clients/rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  publish-root:
    needs: publish-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate with crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish lql crate after registry propagation
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if cargo publish; then
              exit 0
            fi
            if [[ "$attempt" == "12" ]]; then
              exit 1
            fi
            sleep 10
          done
